# Поки тут лише база даних MySQL. Сервер і фронтенд додамо сюди на етапі Docker.
# Запуск: docker compose up -d     Зупинка: docker compose down

services:
  db:
    image: mysql:8.4
    container_name: inventory-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory # базу з такою назвою MySQL створить сам
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory
    ports:
      - '3306:3306' # порт_на_комп'ютері:порт_у_контейнері
    volumes:
      # SQL-скрипти з цієї папки MySQL виконує по черзі (01, 02...) лише при першому запуску, коли база порожня.
      - ./database/init:/docker-entrypoint-initdb.d
      # Файли бази лежать у томі (volume), тому дані не зникають після перезапуску контейнера.
      - db-data:/var/lib/mysql

volumes:
  db-data:
